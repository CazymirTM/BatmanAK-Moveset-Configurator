description = "Gives Batman Nightwing's escrima sticks in the Smoke Pellet's slot (key 6). Aim and throw a stick that ricochets through up to four thugs and flies back to his hand, or double-tap 6 to quickfire. Hold 6 for one second to switch to Nightwing's Electromagnetic Blast and back. NOT COMPATIBLE with Batman Red Hood Guns."
