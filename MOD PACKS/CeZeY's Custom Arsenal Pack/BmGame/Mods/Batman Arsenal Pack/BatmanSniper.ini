; Batman Arsenal Pack - sniper rifle settings. Saved by the mod when you switch modes; edits are picked up while the game runs.
[slot]
; what the Disruptor slot (key 7) holds: disruptor | sniper. Hold the key (or Y on the gamepad gadget wheel) to switch.
selected=sniper
; seconds to hold the Disruptor key to switch
switch_hold=1

[sniper]
; custom = the M170 rifle from BmGame\CookedPCConsole\BatmanArsenalRfl_SF.upk, arkham = the Arkham Knight's (Red Hood's) own sniper rifle from his boss fight
; (when the M170 file is missing the Arkham Knight's rifle is used; the militia rifle is only a last fallback if neither loads)
; M170 model: "M170 Sniper Rifle (Flawless Vendetta)" by Bl4ckGh0st (sketchfab.com/Bl4ckGh0st), CC BY 4.0 (creativecommons.org/licenses/by/4.0), converted for Arkham Knight: parts merged, textures combined into one sheet, resized
rifle_model=custom
; size of the custom rifle (1 = as built), in hand and on the back
custom_scale=1
; 1 = paint the custom rifle's dark body in rifle_rgb (its orange camo stays), 0 = its own colours
rifle_color=0
rifle_rgb=200,35,35
; the custom rifle's gold camo and gold trim: gold = as made, colored = the camo takes rifle_rgb (with rifle_color=1 the whole rifle is that colour),
; off = no camo (the camo areas take the body colour: black, or rifle_rgb with rifle_color=1)
rifle_camo=gold
; 1 = red laser sight while the rifle is aimed (the militia snipers' own laser), 0 = off. laser_key toggles it in game.
laser=1
; key that toggles the laser on/off in game (F5 is the guns' always-in-hand toggle)
laser_key=F6
; laser thickness / glow size
laser_scale=1
; 1 = the laser switches on with the snipers' laser sound
laser_sound=1
magazine=3
damage_mult=12
impulse=1500
range=15000
aim_radius=45
; thugs and the shot: 0 off, 1 thugs nearby hear it and investigate, 2 alarm everyone nearby
gun_noise=2
no_disruptor_filter=1
destroy_objects=1
hit_drones=1
; 1 = use the Dead Zone Aim mod (aim lag + recoil) for the sniper rifle when that mod is installed
dead_zone=1
reload_anim=1

[fear]
; 1 = when the sniper rifle kills a thug, the thugs near him who see it (or are close enough to hear it) flinch and run away
fear=1
; metres around the victim
fear_radius=15
; seconds before the scared thugs pull themselves together
fear_time=20
; 1 = they flinch / cower first (the game's own combat cower reaction)
fear_cower=1

[holster]
; 1 = the sniper rifle is always slung on Batman's back (hidden only while it is in his hands), 0 = never
back_show=1
back_bone=Bip01_Spine2
; auto = fit the rifle across Batman's back on first use (then saved as manual with the offsets below)
back_pose=manual
back_offset=23.731,20.892,4
back_rot=203.978,-12.623,199.973
hand_offset=-14,2,-5
hand_rot=0,0,0
; the same four for the Arkham Knight's rifle (rifle_model=arkham)
ak_back_offset=23.731,20.892,4
ak_back_rot=203.978,-12.623,199.973
ak_hand_offset=-14,2,-5
ak_hand_rot=0,0,0
; and for the custom rifle (rifle_model=custom)
cu_back_offset=23.731,20.892,4
cu_back_rot=203.978,-12.623,199.973
cu_hand_offset=-14,2,-5
cu_hand_rot=0,0,0

[effects]
muzzle_scale=2
; 0 off, 5 tracer (default), 9 shotgun tracer, 10 slow-motion bullet, 12 sniper beam (see SniperFire.cs for the list)
trail=5
trail_scale=1.5
spark_scale=0

[gamepad]
pad_enabled=1
; on the gadget wheel with the Disruptor highlighted
pad_switch=y
; with LT held and the sniper rifle aimed
pad_reload=x
