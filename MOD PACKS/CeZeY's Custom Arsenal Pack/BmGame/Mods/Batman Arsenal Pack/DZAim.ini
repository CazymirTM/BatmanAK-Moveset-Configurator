; Dead Zone Aiming for Batman: Arkham Knight — settings. The file is hot-reloaded (save it — takes effect immediately).
[aim]
; 1 — mod enabled
enabled=1
; 1 — only for Deathstroke (Playable Deathstroke mod); 0 — for every character and the Batmobile
deathstroke_only=1
; 0 — dead zone; 1 — TEST: picture rotated by test_deg in yaw (set here only)
mode=0
test_deg=10
; Zone size: zone_x — fraction of half the screen width, zone_y — of half the height (1.0 = screen edge)
zone_x=0.8
zone_y=0.8
; Spring with which the picture catches up with the reticle (bobot: 150/24.5; TLOU2 1.1.1: 60/24.5)
stiffness=60
damping=24.5
; Soft edge: from which fraction of the radius part of the rotation goes straight into the picture (leak = t^soft_curve)
soft_start=0.7
soft_curve=2
; Aim speed: mouse multiplier while aiming (1 — as in the game; lower — slower)
aim_sens=0.6
; Where it works: the zone turns on while a gadget is aimed (any gadget). cam_states — filter by camera state:
; * — any; comma-separated list — only those; -Name — exclude (e.g. *,-DisruptorSniperStanding). Names are in the log.
; the zone also holds through short camera transitions (throw: Batarang → Walk → Batarang) while the gadget is aimed
cam_states=*

[camera]
; 1 — picture orbits around the camera point at the character (he stays in place in the frame), 0 — rotates in place; fractions — blend
orbit=1
; Orbit center: 0 — R3rdPersonCamera.LastCameraPivotPos, 1 — pawn position + pivot_z, 2 — LastCameraPivotPos + CurrentCameraPivotOffset
pivot_source=2
pivot_z=60
; Reset on a game camera jump: angle (degrees) / position (units, 100 = 1 m); offset release time on exit, s
reset_jump_deg=34
reset_move_uu=150
release_tau=0.12

[reticle]
; Reticle = the gadget's stock cursor moved to the aim point ): 0 — 3D point, projected to the screen by the game;
; 1 — screen coordinates computed by the mod from this frame's lagging picture
reticle_mode=1
; Aim ray: 0 — game camera (CameraCache.POV); 1 — gadget's GetAutoTargetRotation/Origin
aim_source=0
; Ray length to the aim point, units
trace_dist=20000

[debug]
; Summary interval in aim_log.txt, s
log_interval=1
; When to restore the game view in the camera cache: 0 — right after the frame is rendered (default), 1 — at the start of PlayerTick (0.2–0.4)
restore_at=0

[recoil]
; Deathstroke recoil (pistols, shotgun, sniper rifle, auto rifle — aimed shots). The real aim is kicked up/sideways (shots go
; there), the dead zone lets the picture catch up; the view punch additionally jolts the picture (render only).
; 1 — on
recoil=1
; Global multiplier for kick/climb/yaw/punch
recoil_strength=2
; Per weapon, degrees: kick — fast aim kick up (spring back), climb — barrel climb per shot (returns over _recover seconds,
; 0 = recoil_recover_s), yaw — random sideways kick, punch — render-only picture jolt up (+ roll and FOV, see below)
pistol_kick=1.4
pistol_climb=0.5
pistol_yaw=0.4
pistol_recover=0.4
pistol_punch=0.6
shotgun_kick=4.5
shotgun_climb=2
shotgun_yaw=1.2
shotgun_recover=0.35
shotgun_punch=3.5
sniper_kick=5
sniper_climb=2.5
sniper_yaw=0.8
sniper_recover=0.8
sniper_punch=3
; Deathstroke auto rifle — per bullet (~9 per second), the burst reduction is not applied
auto_kick=0.8
auto_climb=0.35
auto_yaw=0.4
auto_recover=0.5
auto_punch=0.35
recoil_recover_s=0.5
; Aim-kick spring (TLOU2: 250 / 20 — slight overshoot)
recoil_kick_stiffness=250
recoil_kick_damping=20
; Burst: shots closer than recoil_burst_window (s) — each ×recoil_burst_scale
recoil_burst_window=0.25
recoil_burst_scale=0.6
; How the aim is turned: 0 — controller rotation (SetRotation), 1 — via mouse input (MouseInput)
recoil_method=0
; View punch (render only, does not move the aim): 1 — on; spring; roll — random roll as a share of the punch;
; fov — degrees of FOV widening per degree of punch
recoil_punch=1
recoil_punch_stiffness=400
recoil_punch_damping=22
recoil_punch_roll=0.35
recoil_punch_fov=0.6

[fp]
; First-person view (Deathstroke only). Set it here.
fp=0
; Eyes relative to the head bone Bip01_Head, units (1 m = 100): forward along the view and up
fp_offset_fwd=10
fp_offset_up=6
; While running the eyes shift forward (the body leans): units at full run speed (600 units/s)
fp_run_fwd=15
; First-person FOV: multiplier of the game camera's FOV (1 — same as the camera)
fp_fov_scale=1.1
; Head position smoothing, s (0 — no smoothing; higher — less bobbing)
fp_smooth=0.05
; 1st/3rd person switch smoothness, s
fp_blend=0.2
; 1 — the body turns where the camera looks (strafe, like in a shooter)
fp_face=1
; Standing still: if the view turns away from the body by more than fp_turn_deg, the body turns (FaceInDirection, the game's turn animations);
; 0 — don't turn
fp_turn_deg=45
; 1 — no zoom on the sniper rifle (Disruptor) in first person: FOV as when not aiming
fp_sniper_nozoom=1
; 1 — aim ray and shots from the eyes (in first person the game camera sits at the eyes; the reticle doesn't jump due to parallax)
fp_aim_from_eye=1
; 1 — third-person view during special moves (takedowns, grabs, counters) and cutscenes
fp_tps_special=1
; Camera states that are always third person (comma-separated)
fp_tps_states=
