name = "Batman Arsenal Pack"
author = "ZeidCeZeY"
version = "1.6.0"
description = "Red Hood's dual handguns (hold 4, shares the REC gun slot) and a sniper rifle (hold 7, shares the Disruptor slot) for Batman: the Arkham Knight's own rifle from his boss fight, with a red laser sight while aiming (F6 toggles it). Both are lethal: shot thugs die and show as DECEASED in Detective Mode. A sniper kill scares the thugs who see it: they cower, then run away for a while. Adds Robin's staff (hold 5, shares the Freeze Blast slot; tap 5 to draw or put it back): he pulls it out with Robin's own animation and fights with only Robin's strikes, counters and takedowns while it is out, then his moveset comes back when it is put away. Includes the Console.txt moveset injector (Batman Hood Custom Armed; applies Binaries/Console.txt on load), Dead Zone Aim (aim lag + recoil for the sniper; settings in DZAim.ini) and a Batclaw Zip Kick (double tap + hold the Batclaw key). Settings in BatmanGuns.ini, BatmanSniper.ini, BatmanStaff.ini and DZAim.ini. Supports Arkham Mod Menu (pause menu > MODS): PACK / GUNS / SNIPER / ZIP KICK / STAFF ACTIVE switches, saved in Settings.ini."
