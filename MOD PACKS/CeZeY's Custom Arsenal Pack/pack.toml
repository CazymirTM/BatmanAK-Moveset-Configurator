name = "CeZeY's Custom Arsenal Pack"
author = "ZeidCeZeY"
version = "1.6.0"
description = "Everything in one install: Red Hood's dual handguns (hold 4, shares the REC gun slot), the Arkham Knight's own sniper rifle with a red laser sight (hold 7, shares the Disruptor slot; sniper kills scare the thugs away), Robin's staff (hold 5, shares the Freeze Blast slot; Batman fights with Robin's own moves while it is out), Dead Zone Aim and the Batclaw Zip Kick, plus the Batman Hood Custom Moveset Armed with its injector and Console.txt and MrBinkss' Red Arkham Knight skin converted for Batman (the Beyond cape is applied automatically). It already contains Batman Red Hood Guns and the moveset's injector, so separate copies of them are disabled on install. Needs the Red Hood Story Pack. Arkham Mod Menu is optional but recommended. Settings in BatmanGuns.ini, BatmanSniper.ini, BatmanStaff.ini and DZAim.ini."
